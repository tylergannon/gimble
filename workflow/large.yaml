name: large
start: chapters
nodes:
  - id: chapters
    type: loop
    label: Execute planned chapters
    checklist: checklist.md
    body: plan
    on_done: success
    max_visits: 40

  - id: plan
    type: codergen
    label: Plan the current chapter
    prompt: The workflow package materializes the chapter planning contract here.
    fidelity: full
    thread_id: large-plan
    timeout: 1d
    edges:
      - to: sprints

  - id: sprints
    type: loop
    label: Execute the current chapter's sprints
    body: implement
    on_done: chapters
    max_visits: 40

  - id: implement
    type: codergen
    label: Implement the current sprint
    prompt: The workflow package materializes the sprint implementation contract here.
    fidelity: full
    thread_id: large-implement
    timeout: 1d
    edges:
      - to: sprints
