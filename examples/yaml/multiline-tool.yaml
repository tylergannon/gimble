name: yaml-multiline-tool
goal: Prove YAML comments and literal block commands work through Tractor.
start: write

nodes:
  # Literal blocks keep shell readable without JSON escaping.
  - id: write
    type: command
    command: |
      mkdir -p tractor-yaml-proof
      printf '%s\n' YAML_MULTILINE_WORKS > tractor-yaml-proof/result.txt
    edges:
      success: verify

  - id: verify
    type: command
    command: |
      test "$(cat tractor-yaml-proof/result.txt)" = YAML_MULTILINE_WORKS
    edges:
      success: success
