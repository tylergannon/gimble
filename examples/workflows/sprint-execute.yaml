name: sprint-execute
goal: >
  Work the sprint ledger until every planned sprint is demonstrated and its
  ledger entry is closed by the engine.
start: sprints

defaults:
  timeout: 3600s
  fidelity: none
  max_retries: 1
  model:
    name: fable

# The sprint loop. The sprint ledger is the checklist: one item per sprint,
# each carrying the command that demonstrates it, an optional infer judge,
# and a doc pointing at that sprint's document. The loop re-reads the ledger
# on every arrival, validates the sprint the previous lap worked on, and
# marks it done itself. No agent writes done, so a sprint cannot be closed
# by an agent that believes it finished.
#
# The reviewer runs on another provider with fresh context, per the rule that
# a sprint is demonstrated rather than asserted. It cannot route to success:
# leaving the loop is the loop node's decision, made against the ledger's
# definition of done.
#
# Once per-node skills land (issue #56), the sprint doctrine — ledger shape,
# chapter links, the pyramid index, what a sprint may not do — moves out of
# these prompts and onto the implement and review nodes as a skill.
nodes:
  - id: sprints
    type: loop
    checklist: docs/sprints/ledger.md
    max_visits: 40
    edges:
      loop: implement
      exit: success
    goal_evaluator:
      model:
        name: flash

  - id: implement
    type: agent
    prompt: >
      Execute the current sprint. Work through its document phase by phase,
      in order, and prove each phase before moving on. Commit as you go with
      specific paths. If something blocks you, record what is blocked and
      why, then continue with the next unblocked task.
    edges:
      - to: test

  - id: test
    type: command
    command: |
      set -eu
      go test ./...
    edges:
      success: review
      error: implement

  - id: review
    type: agent
    model:
      name: gpt
    prompt: >
      Review the work against the current sprint's document. Run the software
      yourself; do not judge from the diff alone. Decide whether the sprint's
      claims are demonstrated.
    edges:
      - to: sprints
        condition: The sprint is demonstrated and nothing material is missing.
      - to: implement
        condition: Work remains, or the demonstration does not convince you.
