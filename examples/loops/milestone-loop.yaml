name: milestone-loop
goal: >
  Build calc.sh in this workspace until both claims are demonstrable:
  `sh calc.sh add 2 3` prints 5, and `sh calc.sh mul 2 3` prints 6.
start: pick

defaults:
  timeout: 300s
  fidelity: none
  max_retries: 1
  llm_provider: anthropic
  llm_model: claude-sonnet-5
  reasoning_effort: low

# The shape for "keep working until it's actually done": one node picks the
# next bite-sized step, one does it, a command checks, repeat. The chooser
# sees the workspace as it is NOW each lap — no upfront plan to go stale.
# Routing is carried by the edge conditions; the engine turns them into a
# structured choice the agent answers. To adapt: change the goal and the
# check's command.
#
# Plan-first variant: add a planner agent before pick that writes the
# ordered steps to plan.md, when you want to read the plan before the
# tokens burn.
nodes:
  - id: pick
    type: agent
    max_visits: 8
    prompt: >
      $goal

      Choose the smallest next step that can be demonstrated by running
      something, and record it as the only content of STEP.md.
    edges:
      - to: implement
        condition: A next step remains.
      - to: success
        condition: Every claim in the goal is demonstrable now.

  - id: implement
    type: agent
    max_visits: 8
    prompt: Complete the step recorded in STEP.md.
    edges:
      - to: check

  - id: check
    type: command
    max_visits: 16
    command: |
      set -eu
      test "$(sh calc.sh add 2 3)" = 5
      test "$(sh calc.sh mul 2 3)" = 6
    edges:
      success: success
      error: pick
