name: bake-off
goal: >
  Create fizzbuzz.sh in this workspace: `sh fizzbuzz.sh N` prints the
  classic FizzBuzz lines from 1 to N, one per line.
start: attempts

defaults:
  timeout: 600s
  fidelity: none
  max_retries: 1

# The shape for "try a couple of approaches in parallel, keep the best".
# Three isolated attempts at the same goal; the judge decides on
# demonstrated behavior, not on the reports. To adapt: change the goal and
# the final check.
nodes:
  - id: attempts
    type: fan_out
    max_parallel: 3
    branches:
      - id: attempt_claude
        artifacts: [REPORT.md]
        agent:
          llm_provider: anthropic
          llm_model: claude-sonnet-5
          reasoning_effort: low
          prompt: >
            $goal

            Leave REPORT.md recording what you built and how you proved it
            works.
      - id: attempt_codex
        artifacts: [REPORT.md]
        agent:
          llm_provider: openai
          llm_model: gpt-5.6-sol
          reasoning_effort: low
          prompt: >
            $goal

            Leave REPORT.md recording what you built and how you proved it
            works.
      - id: attempt_gemini
        artifacts: [REPORT.md]
        agent:
          llm_provider: gemini
          llm_model: gemini-3.1-pro-low
          reasoning_effort: low
          prompt: >
            $goal

            Leave REPORT.md recording what you built and how you proved it
            works.
    branch_edges:
      - to: judge

  - id: judge
    type: fan_in
    llm_provider: anthropic
    llm_model: claude-sonnet-5
    reasoning_effort: low
    prompt: >
      Judge the branches on demonstrated behavior, running each one
      yourself. Merge the winning fizzbuzz.sh into this main workspace and
      record the decision in WINNER.md.
    edges:
      - to: verify

  - id: verify
    type: command
    command: |
      set -eu
      test "$(sh fizzbuzz.sh 3 | tail -1)" = Fizz
      test "$(sh fizzbuzz.sh 5 | tail -1)" = Buzz
      test "$(sh fizzbuzz.sh 15 | tail -1)" = FizzBuzz
      test -f WINNER.md
    edges:
      success: success
