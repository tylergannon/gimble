name: critique-circle
goal: >
  Three providers each write a proposal on the topic in TOPIC.md, then each
  critiques the other two.
start: write_topic

defaults:
  timeout: 600s
  fidelity: none
  max_retries: 1

# The shape for "have a couple of models cross-check this": same topic to
# everyone, independent proposals, mutual critique. To adapt: change what
# write_topic puts in TOPIC.md.
nodes:
  - id: write_topic
    type: command
    command: |
      printf '%s\n' 'Propose a three-sentence README tagline for a tool that runs multi-model agent pipelines. State your reasoning in one short paragraph.' > TOPIC.md
    edges:
      success: propose

  - id: propose
    type: fan_out
    max_parallel: 3
    branches:
      - id: claude_proposal
        artifacts: [claude_proposal.md]
        agent:
          model:
            name: claude-sonnet-5
            effort: low
          prompt: >
            $goal

            Write your own proposal to claude_proposal.md.
      - id: codex_proposal
        artifacts: [codex_proposal.md]
        agent:
          model:
            name: gpt-5.6-sol
            effort: low
          prompt: >
            $goal

            Write your own proposal to codex_proposal.md.
      - id: gemini_proposal
        artifacts: [gemini_proposal.md]
        agent:
          model:
            name: gemini-3.1-pro-low
            effort: low
          prompt: >
            $goal

            Write your own proposal to gemini_proposal.md.
    branch_edges:
      - to: collect_proposals

  - id: collect_proposals
    type: fan_in
    model:
      name: claude-sonnet-5
      effort: low
    prompt: >
      Copy each branch's collected proposal unchanged into this main
      workspace as proposals/<name>.md, where <name> is claude, codex, or
      gemini.
    edges:
      - to: critique

  - id: critique
    type: fan_out
    max_parallel: 3
    branches:
      - id: claude_critique
        artifacts: [claude_critique.md]
        agent:
          model:
            name: claude-sonnet-5
            effort: low
          prompt: >
            Critique the other two proposals in proposals/ — not your own,
            proposals/claude.md — in claude_critique.md: where each is
            strong, where it is weak or wrong, and what all three of you
            agree on.
      - id: codex_critique
        artifacts: [codex_critique.md]
        agent:
          model:
            name: gpt-5.6-sol
            effort: low
          prompt: >
            Critique the other two proposals in proposals/ — not your own,
            proposals/codex.md — in codex_critique.md: where each is
            strong, where it is weak or wrong, and what all three of you
            agree on.
      - id: gemini_critique
        artifacts: [gemini_critique.md]
        agent:
          model:
            name: gemini-3.1-pro-low
            effort: low
          prompt: >
            Critique the other two proposals in proposals/ — not your own,
            proposals/gemini.md — in gemini_critique.md: where each is
            strong, where it is weak or wrong, and what all three of you
            agree on.
    branch_edges:
      - to: collect_critiques

  - id: collect_critiques
    type: fan_in
    model:
      name: claude-sonnet-5
      effort: low
    prompt: >
      Copy each branch's collected critique unchanged into this main
      workspace as critiques/<name>.md, where <name> is claude, codex, or
      gemini.
    edges:
      - to: success
