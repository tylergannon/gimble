name: checklist-loop
goal: Work through the checklist until every item is demonstrated.
start: items

defaults:
  timeout: 600s
  fidelity: none
  max_retries: 1
  model:
    name: claude-sonnet-5
    effort: low

# The shape for "work through this list and prove each item": a loop node
# iterates a checklist file. On every arrival it re-reads the file, validates
# the item the previous lap worked on — runs its command, then asks its
# `infer` judge if it has one — and marks it `done: true` itself when the
# whole validation set passes. After each passing lap, an evaluator reads the
# checklist body's definition of done and either exits or re-reads the ledger
# and injects its first open item into the body's prompt as a frame: name,
# check, command, the last failure, the item's doc. The agent never marks
# items. That is why implement's prompt can be deictic:
# "the current checklist item" is whatever the frame says. To adapt: copy
# checklist-loop.md (beside this file) to the path below and edit its items.
nodes:
  - id: items
    type: loop
    checklist: ephemeral/projects/demo/checklist.md
    edges:
      loop: implement
      exit: success
    max_visits: 20

  - id: implement
    type: agent
    prompt: Implement the current checklist item so that its check holds.
    edges:
      - to: items
