<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A cheerful tractor tows three wagons of pipeline nodes while a small supervisor bird keeps watch from above">
  <!-- sun -->
  <g stroke="#fbbf24" stroke-width="4" stroke-linecap="round">
    <circle cx="66" cy="58" r="20" fill="#fcd34d" stroke="none"/>
    <line x1="66" y1="22" x2="66" y2="10"/>
    <line x1="66" y1="94" x2="66" y2="106"/>
    <line x1="30" y1="58" x2="18" y2="58"/>
    <line x1="102" y1="58" x2="114" y2="58"/>
    <line x1="41" y1="33" x2="32" y2="24"/>
    <line x1="91" y1="83" x2="100" y2="92"/>
    <line x1="41" y1="83" x2="32" y2="92"/>
    <line x1="91" y1="33" x2="100" y2="24"/>
  </g>

  <!-- cloud -->
  <g fill="#cbd5e1" opacity="0.85">
    <ellipse cx="240" cy="52" rx="34" ry="16"/>
    <ellipse cx="270" cy="44" rx="26" ry="14"/>
    <ellipse cx="212" cy="46" rx="20" ry="12"/>
  </g>

  <!-- ground -->
  <line x1="24" y1="262" x2="736" y2="262" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 16"/>

  <!-- supervisor bird -->
  <g>
    <!-- dashed steering line down to the tractor cab -->
    <path d="M 610 96 Q 640 150 646 176" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="588" cy="74" rx="26" ry="19" fill="#38bdf8"/>
    <!-- wing -->
    <path d="M 588 72 Q 566 58 556 70 Q 568 80 588 78 Z" fill="#0ea5e9"/>
    <!-- tail -->
    <path d="M 563 78 L 548 70 L 550 84 Z" fill="#0ea5e9"/>
    <!-- head -->
    <circle cx="614" cy="62" r="13" fill="#38bdf8"/>
    <!-- hard hat -->
    <path d="M 602 56 A 12 12 0 0 1 626 56 Z" fill="#f59e0b"/>
    <rect x="599" y="55" width="30" height="4" rx="2" fill="#f59e0b"/>
    <!-- eye -->
    <circle cx="618" cy="62" r="2.6" fill="#0f172a"/>
    <!-- beak -->
    <path d="M 626 64 L 637 67 L 626 70 Z" fill="#f59e0b"/>
    <!-- speech bubble -->
    <g>
      <rect x="628" y="24" width="58" height="28" rx="14" fill="#e2e8f0"/>
      <path d="M 640 50 L 634 60 L 650 51 Z" fill="#e2e8f0"/>
      <text x="657" y="43" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">steer!</text>
    </g>
  </g>

  <!-- wagons -->
  <g>
    <!-- hitch bars -->
    <line x1="148" y1="236" x2="180" y2="236" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <line x1="288" y1="236" x2="320" y2="236" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <line x1="428" y1="236" x2="502" y2="236" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <!-- wagon 1: graph -->
    <rect x="40" y="190" width="108" height="52" rx="10" fill="#22c55e"/>
    <circle cx="68" cy="250" r="13" fill="#334155"/>
    <circle cx="68" cy="250" r="5" fill="#cbd5e1"/>
    <circle cx="120" cy="250" r="13" fill="#334155"/>
    <circle cx="120" cy="250" r="5" fill="#cbd5e1"/>
    <text x="94" y="223" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">{ }</text>

    <!-- wagon 2: loop -->
    <rect x="180" y="190" width="108" height="52" rx="10" fill="#f59e0b"/>
    <circle cx="208" cy="250" r="13" fill="#334155"/>
    <circle cx="208" cy="250" r="5" fill="#cbd5e1"/>
    <circle cx="260" cy="250" r="13" fill="#334155"/>
    <circle cx="260" cy="250" r="5" fill="#cbd5e1"/>
    <text x="234" y="226" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">&#8634;</text>

    <!-- wagon 3: check -->
    <rect x="320" y="190" width="108" height="52" rx="10" fill="#8b5cf6"/>
    <circle cx="348" cy="250" r="13" fill="#334155"/>
    <circle cx="348" cy="250" r="5" fill="#cbd5e1"/>
    <circle cx="400" cy="250" r="13" fill="#334155"/>
    <circle cx="400" cy="250" r="5" fill="#cbd5e1"/>
    <text x="374" y="225" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">&#10003;</text>
  </g>

  <!-- tractor (facing right) -->
  <g>
    <!-- exhaust puffs -->
    <circle cx="518" cy="118" r="7" fill="#94a3b8" opacity="0.9"/>
    <circle cx="510" cy="100" r="9" fill="#94a3b8" opacity="0.6"/>
    <circle cx="498" cy="82" r="11" fill="#94a3b8" opacity="0.35"/>
    <!-- exhaust pipe -->
    <rect x="514" y="128" width="12" height="34" rx="4" fill="#64748b"/>

    <!-- cab -->
    <rect x="600" y="130" width="92" height="72" rx="12" fill="#ef4444"/>
    <rect x="612" y="142" width="56" height="40" rx="8" fill="#bae6fd"/>
    <!-- driver-less: a tiny heart on the window -->
    <path d="M 640 158 c -3 -6 -12 -4 -12 3 c 0 6 12 12 12 12 c 0 0 12 -6 12 -12 c 0 -7 -9 -9 -12 -3 Z" fill="#ef4444"/>

    <!-- hood -->
    <rect x="490" y="162" width="126" height="46" rx="14" fill="#ef4444"/>
    <rect x="490" y="196" width="202" height="30" rx="10" fill="#dc2626"/>
    <!-- headlight -->
    <circle cx="502" cy="180" r="7" fill="#fde047"/>

    <!-- front wheel (left, small) -->
    <circle cx="512" cy="238" r="26" fill="#334155"/>
    <circle cx="512" cy="238" r="11" fill="#cbd5e1"/>
    <circle cx="512" cy="238" r="4" fill="#64748b"/>

    <!-- rear wheel (right, big) -->
    <circle cx="652" cy="216" r="48" fill="#334155"/>
    <circle cx="652" cy="216" r="22" fill="#cbd5e1"/>
    <circle cx="652" cy="216" r="8" fill="#64748b"/>
    <g stroke="#64748b" stroke-width="4" stroke-linecap="round">
      <line x1="652" y1="199" x2="652" y2="188"/>
      <line x1="652" y1="233" x2="652" y2="244"/>
      <line x1="635" y1="216" x2="624" y2="216"/>
      <line x1="669" y1="216" x2="680" y2="216"/>
      <line x1="640" y1="204" x2="632" y2="196"/>
      <line x1="664" y1="228" x2="672" y2="236"/>
      <line x1="640" y1="228" x2="632" y2="236"/>
      <line x1="664" y1="204" x2="672" y2="196"/>
    </g>
  </g>
</svg>
