name: ask-proof
goal: Prove that an agent inside a run can ask a question and receive the answer.
start: interview

defaults:
  timeout: 20m
  fidelity: none
  max_retries: 0
  llm_provider: openai
  llm_model: gpt-5.6-sol
  reasoning_effort: low

nodes:
  - id: interview
    type: codergen
    prompt: |
      You must obtain a secret word from the reviewer. Write a short markdown question file asking for the secret word, then run

        go run ./cmd/tractor ask <that file>

      with the environment variable TRACTOR_INTERVIEW_DIR set to the value of the ASK_PROOF_DIR environment variable. The command blocks until the reviewer answers and then prints the answer. If your shell tool times out while it waits, run the same command again with the moved path it printed (interview/0001.md); it resumes waiting. Write the answer, exactly as printed and nothing else, to the file named by the ASK_PROOF_OUT environment variable. Do not modify any other file in the repository.
    edges:
      - to: success
