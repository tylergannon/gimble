name: issue-32-validate-every-lap
goal: |
  The condition described in ephemeral/projects/tractor/issues-32-37/ISSUE-32.md
  holds in this repository: on every lap return the loop node validates the
  framed item and every item already marked done, marking the framed item only
  when all of them pass and un-marking any done item that regressed, so no
  item's validation is ever skipped; the tests and documentation the brief
  names cover the new behavior; and
  `go build ./... && go test -count=1 ./...` exits 0.
start: implement

defaults:
  timeout: 2400s
  fidelity: none
  max_retries: 1
  llm_provider: openai
  llm_model: gpt-5.6-sol
  reasoning_effort: high

nodes:
  - id: implement
    type: codergen
    max_visits: 4
    prompt: $goal
    edges:
      - to: check

  - id: check
    type: tool
    tool_command: go build ./... && go test -count=1 ./...
    on_success: success
    on_error: implement
